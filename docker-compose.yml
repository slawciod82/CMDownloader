services:
  downloader:
    build: .
    environment:
      CM_STATE_DATABASE_PATH: /state/cm_downloader.db
      CM_ACCOUNT_WORKERS: ${CM_ACCOUNT_WORKERS:-1}
      CM_MAX_DOWNLOAD_WORKERS: ${CM_MAX_DOWNLOAD_WORKERS:-1}
    volumes:
      - ./app_cfg.py:/app/app_cfg.py:ro
      - ${CM_STATE_DIR:-./state}:/state
      - /UPLOAD:/UPLOAD
    command:
      - sh
      - -c
      - |
          fs_type="$$(stat -f -c %T /UPLOAD 2>/dev/null || true)"
          case "$$fs_type" in
            nfs|nfs4) exec python run.py ;;
            *)
              echo "ERROR: /UPLOAD must be an NFS mount (found: $${fs_type:-unavailable}). Retrying after container restart." >&2
              sleep 15
              exit 1
              ;;
          esac
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
